- description: H1 Consultar tiempo de llegada
  vars: {id: H1, historia: "Como pasajero, quiero consultar el tiempo estimado de llegada de un bus a mi paradero para decidir cuándo salir de casa."}
  assert:
    - type: javascript      # A6: una historia válida debe aceptarse (invest_ok) y traer escenarios
      metric: A6_acepta_historia_valida
      value: |
        (() => { let o; try { o = JSON.parse(output); } catch (e) { return false; } return o.invest_ok === true && (o.escenarios || []).length >= 2; })()
