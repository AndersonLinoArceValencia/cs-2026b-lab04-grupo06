<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 920" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#37474F" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E65100" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1565C0" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2E7D32" />
    </marker>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="675" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A237E">RutaSIT Arequipa — Vista de Despliegue Físico en VPS</text>
  <text x="675" y="60" text-anchor="middle" font-size="13" fill="#546E7A">Entregable E6 • Topología Física de Contenedores y Procesos en 1 VPS de Bajo Costo (Linux / Docker Compose)</text>

  <!-- USUARIOS Y DISPOSITIVOS (EXTERNO) -->
  <g transform="translate(50, 90)">
    <!-- Buses GPS -->
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">🚌 300 Buses SIT (GPS)</text>
    <text x="140" y="50" text-anchor="middle" font-size="12" fill="#1565C0">Módem Celular 3G/4G</text>
    <text x="140" y="68" text-anchor="middle" font-size="11" fill="#546E7A">POST c/10s • ~30 req/s continuas</text>

    <!-- Pasajeros PWA -->
    <rect x="485" y="0" width="280" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="625" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">📱 Pasajeros SIT (PWA)</text>
    <text x="625" y="50" text-anchor="middle" font-size="12" fill="#1565C0">Navegadores Móviles / Leaflet</text>
    <text x="625" y="68" text-anchor="middle" font-size="11" fill="#546E7A">WebSockets + HTTPS (ETA ≤ 15s)</text>

    <!-- Operador SIT -->
    <rect x="970" y="0" width="280" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="1110" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">💻 Operador SIT (Consola Web)</text>
    <text x="1110" y="50" text-anchor="middle" font-size="12" fill="#1565C0">Centro de Gestión y Control</text>
    <text x="1110" y="68" text-anchor="middle" font-size="11" fill="#546E7A">Monitoreo de alertas y frecuencias</text>
  </g>

  <!-- CLUSTER SERVIDOR VPS -->
  <rect x="50" y="215" width="1250" height="580" rx="14" fill="#FAFAFA" stroke="#37474F" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#drop-shadow)"/>
  <text x="80" y="244" font-size="16" font-weight="bold" fill="#263238">🖥️ Servidor en la Nube (VPS de Producción: 2-4 vCPU, 4-8 GB RAM, Linux / Docker Compose)</text>

  <!-- Proxy Nginx -->
  <g transform="translate(80, 265)">
    <rect x="0" y="0" width="1190" height="65" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
    <text x="595" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Nginx Reverse Proxy &amp; Load Balancer (Contenedor Docker: :80/:443)</text>
    <text x="595" y="48" text-anchor="middle" font-size="12" fill="#455A64">Terminación SSL/HTTPS • Proxy Pass ASGI a FastAPI • Proxy WebSocket con ulimit -n 65535 (soporta 1500+ conexiones concurrentes)</text>
  </g>

  <!-- CLUSTER MONOLITO MODULAR -->
  <g transform="translate(80, 355)">
    <rect x="0" y="0" width="1190" height="175" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="20" y="26" font-size="14" font-weight="bold" fill="#1B5E20">📦 Cluster de Aplicación: Monolito Modular Asíncrono (FastAPI ASGI)</text>

    <!-- Componente FastAPI Core -->
    <rect x="20" y="40" width="360" height="115" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="200" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">FastAPI Core Application</text>
    <text x="200" y="88" text-anchor="middle" font-size="11" fill="#2E7D32">API Gateway ASGI + Router Modular</text>
    <text x="200" y="106" text-anchor="middle" font-size="11" fill="#333333">• Módulo Ingesta GPS [RF-01]</text>
    <text x="200" y="124" text-anchor="middle" font-size="11" fill="#333333">• WebSocket Server &amp; Pub/Sub [RF-02, RF-03]</text>
    <text x="200" y="142" text-anchor="middle" font-size="11" fill="#333333">• Módulo Catálogo y Supervisión [RF-05, RF-06]</text>

    <!-- Componente Worker Geoespacial -->
    <rect x="415" y="40" width="360" height="115" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="595" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">Worker Geoespacial &amp; ETA</text>
    <text x="595" y="88" text-anchor="middle" font-size="11" fill="#2E7D32">Procesamiento Fuera del Event Loop</text>
    <text x="595" y="106" text-anchor="middle" font-size="11" fill="#333333">• Consume telemetría desde Redis Streams</text>
    <text x="595" y="124" text-anchor="middle" font-size="11" fill="#333333">• Proyecciones Shapely/PostGIS y cálculo ETA</text>
    <text x="595" y="142" text-anchor="middle" font-size="11" fill="#333333">• Detección desvío &gt;100m y alertas de congestión</text>

    <!-- Componente Batch Writer Worker -->
    <rect x="810" y="40" width="360" height="115" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="990" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">Batch Telemetry Inserter</text>
    <text x="990" y="88" text-anchor="middle" font-size="11" fill="#2E7D32">Persistencia Consolidada por Lotes</text>
    <text x="990" y="106" text-anchor="middle" font-size="11" fill="#333333">• Lee lotes de Redis Streams cada 5 segundos</text>
    <text x="990" y="124" text-anchor="middle" font-size="11" fill="#333333">• Ejecuta COPY masivo a PostgreSQL</text>
    <text x="990" y="142" text-anchor="middle" font-size="11" fill="#333333">• Evita saturación de I/O en disco VPS (R-03)</text>
  </g>

  <!-- CLUSTER DE ALMACENAMIENTO Y OBSERVABILIDAD -->
  <g transform="translate(80, 555)">
    <!-- Redis en Memoria -->
    <rect x="0" y="0" width="370" height="215" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="185" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#BF360C">⚡ Redis 7.x (En Memoria)</text>
    <text x="185" y="50" text-anchor="middle" font-size="11" fill="#E65100">Almacenamiento ultra veloz (RAM ~150 MB)</text>
    <text x="20" y="80" font-size="12" fill="#333333">• <b>Streams (telemetry_stream):</b> Ingesta &lt; 1ms</text>
    <text x="20" y="105" font-size="12" fill="#333333">• <b>Hash (bus:locations):</b> Última posición 300 buses</text>
    <text x="20" y="130" font-size="12" fill="#333333">• <b>Pub/Sub (channel:eta_updates):</b> Difusión WS</text>
    <text x="20" y="155" font-size="12" fill="#333333">• <b>Cache (routes:catalog):</b> TTL 24 horas</text>
    <text x="20" y="185" font-size="11" font-style="italic" fill="#BF360C">🛡️ Persistencia RDB periódica activada (anti-SPOF)</text>

    <!-- PostgreSQL / PostGIS -->
    <rect x="410" y="0" width="430" height="215" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="625" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#BF360C">🐘 PostgreSQL 16 + Extensión PostGIS 3.4</text>
    <text x="625" y="50" text-anchor="middle" font-size="11" fill="#E65100">Base de Datos Relacional y Geoespacial Central</text>
    <text x="430" y="80" font-size="12" fill="#333333">• <b>Esquema Catálogo SIT:</b> Rutas, paraderos y geometrías</text>
    <text x="430" y="105" font-size="12" fill="#333333">• <b>Esquema Flota:</b> Registro de unidades, conductores y tarifas</text>
    <text x="430" y="130" font-size="12" fill="#333333">• <b>Esquema Telemetría:</b> Histórico particionado por fecha</text>
    <text x="430" y="155" font-size="12" fill="#333333">• <b>Índices Espaciales:</b> GiST en geometrías para consultas &lt; 5ms</text>
    <text x="430" y="185" font-size="11" font-style="italic" fill="#BF360C">🔒 Connection Pool limitado (PgBouncer/SQLAlchemy)</text>

    <!-- Pila de Observabilidad -->
    <rect x="880" y="0" width="310" height="215" rx="10" fill="#ECEFF1" stroke="#37474F" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="1035" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">📊 Observabilidad &amp; Métricas</text>
    <text x="1035" y="50" text-anchor="middle" font-size="11" fill="#455A64">Monitoreo de Acuerdos de Nivel de Servicio</text>
    <text x="900" y="85" font-size="12" fill="#333333">• <b>Prometheus:</b> Scrape /metrics cada 10s</text>
    <text x="900" y="110" font-size="12" fill="#333333">• <b>Grafana:</b> Dashboard en tiempo real</text>
    <text x="900" y="135" font-size="12" fill="#333333">• Monitoreo latencia p95 (QA-01 ≤ 15s)</text>
    <text x="900" y="160" font-size="12" fill="#333333">• Alarmas de uso de CPU (≤ 75%) y RAM</text>
    <text x="900" y="185" font-size="11" font-style="italic" fill="#1565C0">Consumo total observabilidad &lt; 200 MB</text>
  </g>

  <!-- SERVICIOS EXTERNOS (INTERNET) -->
  <g transform="translate(150, 825)">
    <!-- OpenStreetMap -->
    <rect x="0" y="0" width="480" height="65" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="5 3" filter="url(#drop-shadow)"/>
    <text x="240" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">🗺️ OpenStreetMap CDN / Tile Server (Servicio Externo Libre)</text>
    <text x="240" y="50" text-anchor="middle" font-size="11" fill="#6A1B9A">Descarga directa de teselas cartográficas por la PWA móvil del pasajero (0 costo de API)</text>

    <!-- Web Push -->
    <rect x="570" y="0" width="480" height="65" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="5 3" filter="url(#drop-shadow)"/>
    <text x="810" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">🔔 Servicio Web Push / Navegadores (Servicio Externo)</text>
    <text x="810" y="50" text-anchor="middle" font-size="11" fill="#6A1B9A">Notificaciones automáticas a pasajeros por desvíos de ruta o demoras severas</text>
  </g>

  <!-- FLECHAS Y CONEXIONES CON LABELS (Edge(label=...)) -->
  <!-- Buses a Nginx -->
  <line x1="190" y1="170" x2="280" y2="265" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="205" width="130" height="20" rx="4" fill="#FFFFFF" stroke="#37474F" stroke-width="1"/>
  <text x="235" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474F">POST /telemetry (c/10s)</text>

  <!-- Pasajeros a Nginx -->
  <line x1="625" y1="170" x2="675" y2="265" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="595" y="205" width="155" height="20" rx="4" fill="#FFFFFF" stroke="#1565C0" stroke-width="1"/>
  <text x="672" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">HTTPS / WSS (ETA ≤ 15s)</text>

  <!-- Operador a Nginx -->
  <line x1="1110" y1="170" x2="1050" y2="265" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1035" y="205" width="95" height="20" rx="4" fill="#FFFFFF" stroke="#37474F" stroke-width="1"/>
  <text x="1082" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#37474F">HTTPS Admin</text>

  <!-- Nginx a FastAPI -->
  <line x1="300" y1="330" x2="260" y2="395" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="240" y="365" font-size="10" font-weight="bold" fill="#2E7D32">ASGI Proxy Pass</text>

  <!-- FastAPI a Redis -->
  <line x1="220" y1="510" x2="220" y2="555" stroke="#E65100" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="145" y="535" font-size="10" font-weight="bold" fill="#E65100">XADD /telemetry_stream</text>

  <!-- Redis a Worker Geoespacial -->
  <line x1="370" y1="600" x2="470" y2="510" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="375" y="555" font-size="10" fill="#E65100">read stream</text>

  <!-- Worker Geoespacial a Redis (actualiza estado y Pub/Sub) -->
  <line x1="510" y1="510" x2="370" y2="650" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="425" y="580" font-size="10" fill="#2E7D32">update bus:locations</text>

  <!-- Redis a Batch Writer Worker -->
  <line x1="370" y1="700" x2="860" y2="510" stroke="#E65100" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="580" y="540" font-size="10" fill="#E65100">batch read (c/5s)</text>

  <!-- Batch Writer a PostgreSQL -->
  <line x1="900" y1="510" x2="750" y2="555" stroke="#BF360C" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="800" y="535" font-size="10" font-weight="bold" fill="#BF360C">COPY / Batch INSERT</text>

  <!-- FastAPI a PostgreSQL (Catálogo) -->
  <line x1="350" y1="510" x2="500" y2="555" stroke="#37474F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="535" font-size="10" fill="#37474F">SQL queries</text>

  <!-- FastAPI a Observabilidad -->
  <line x1="380" y1="430" x2="1000" y2="430" stroke="#37474F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1000" y1="430" x2="1000" y2="555" stroke="#37474F" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="880" y="420" font-size="10" fill="#37474F">metrics /metrics</text>

  <!-- Pasajeros a OSM -->
  <path d="M 485 130 C 100 130, 80 840, 150 855" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="95" y="790" font-size="10" fill="#6A1B9A">Tiles OSM</text>

  <!-- FastAPI a Web Push -->
  <path d="M 380 470 C 1200 470, 1200 840, 1050 855" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="1160" y="790" font-size="10" fill="#6A1B9A">Push API</text>
</svg>