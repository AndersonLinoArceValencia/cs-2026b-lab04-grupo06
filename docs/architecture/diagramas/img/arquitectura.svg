<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#37474F" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E65100" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1565C0" />
    </marker>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A237E">RutaSIT Arequipa — Arquitectura Elegida: Monolito Modular Asíncrono</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#546E7A">Entregable E3 • Vista de Contenedores y Módulos con Ingesta en Tiempo Real (FastAPI + Redis + PostGIS)</text>

  <!-- ACTORES -->
  <g transform="translate(50, 90)">
    <!-- Bus GPS -->
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="140" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">🚌 Bus SIT (Dispositivo GPS)</text>
    <text x="140" y="52" text-anchor="middle" font-size="12" fill="#1565C0">300 unidades • Trama GPS c/10s</text>
    <text x="140" y="68" text-anchor="middle" font-size="11" fill="#546E7A">~30 peticiones/segundo continuas</text>

    <!-- Pasajero SIT -->
    <rect x="460" y="0" width="280" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="600" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">📱 Pasajero SIT (App Móvil / PWA)</text>
    <text x="600" y="52" text-anchor="middle" font-size="12" fill="#1565C0">Cliente Leaflet.js • OpenStreetMap</text>
    <text x="600" y="68" text-anchor="middle" font-size="11" fill="#546E7A">Consulta rutas y WebSockets en tiempo real</text>

    <!-- Operador SIT -->
    <rect x="870" y="0" width="280" height="80" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="1010" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0D47A1">💻 Operador SIT (Centro Control)</text>
    <text x="1010" y="52" text-anchor="middle" font-size="12" fill="#1565C0">Consola Web de Supervisión</text>
    <text x="1010" y="68" text-anchor="middle" font-size="11" fill="#546E7A">Monitoreo de frecuencias y alertas</text>
  </g>

  <!-- CONTENEDOR MONOLITO PRINCIPAL -->
  <rect x="50" y="220" width="1100" height="400" rx="14" fill="#FAFAFA" stroke="#37474F" stroke-width="2" stroke-dasharray="6 4" filter="url(#drop-shadow)"/>
  <text x="75" y="248" font-size="16" font-weight="bold" fill="#263238">📦 Monolito Modular Asíncrono (Servidor VPS único: 2-4 vCPU, 4-8 GB RAM)</text>

  <!-- Capa Entrada ASGI / Nginx -->
  <rect x="80" y="265" width="1040" height="55" rx="8" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Capa de Entrada: API Gateway ASGI (FastAPI + Nginx Reverse Proxy)</text>
  <text x="600" y="308" text-anchor="middle" font-size="12" fill="#455A64">Terminación SSL/HTTPS • Enrutamiento ASGI • Balanceo interno de WebSockets masivos (ulimit optimizado)</text>

  <!-- MÓDULOS DE DOMINIO -->
  <g transform="translate(80, 340)">
    <!-- M1 Ingesta GPS -->
    <rect x="0" y="0" width="195" height="140" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="97" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Módulo Ingesta GPS</text>
    <text x="97" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">[RF-01]</text>
    <text x="97" y="65" text-anchor="middle" font-size="11" fill="#333333">• Validación de esquema</text>
    <text x="97" y="82" text-anchor="middle" font-size="11" fill="#333333">• Deserialización rápida</text>
    <text x="97" y="99" text-anchor="middle" font-size="11" fill="#333333">• Encolado en stream</text>
    <text x="97" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="#1B5E20">Latencia &lt; 2 ms</text>

    <!-- M2 ETA y Geocercas -->
    <rect x="211" y="0" width="195" height="140" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="308" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Módulo ETA &amp; Geocercas</text>
    <text x="308" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">[RF-03, RF-04]</text>
    <text x="308" y="65" text-anchor="middle" font-size="11" fill="#333333">• Proyección paraderos</text>
    <text x="308" y="82" text-anchor="middle" font-size="11" fill="#333333">• Estimación ETA dinámico</text>
    <text x="308" y="99" text-anchor="middle" font-size="11" fill="#333333">• Detección desvío &gt;100m</text>
    <text x="308" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="#1B5E20">Tiempo ETA ≤ 15 s</text>

    <!-- M3 Notificaciones & WS -->
    <rect x="422" y="0" width="195" height="140" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="519" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Módulo Notificaciones</text>
    <text x="519" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">[RF-02, RF-03]</text>
    <text x="519" y="65" text-anchor="middle" font-size="11" fill="#333333">• WebSocket Server</text>
    <text x="519" y="82" text-anchor="middle" font-size="11" fill="#333333">• Suscripción por ruta</text>
    <text x="519" y="99" text-anchor="middle" font-size="11" fill="#333333">• Difusión a pasajeros</text>
    <text x="519" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="#1B5E20">Concurrencia alta</text>

    <!-- M4 Catálogo SIT -->
    <rect x="633" y="0" width="195" height="140" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="730" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Módulo Catálogo SIT</text>
    <text x="730" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">[RF-06]</text>
    <text x="730" y="65" text-anchor="middle" font-size="11" fill="#333333">• Rutas y variantes SIT</text>
    <text x="730" y="82" text-anchor="middle" font-size="11" fill="#333333">• Paraderos y geocercas</text>
    <text x="730" y="99" text-anchor="middle" font-size="11" fill="#333333">• Tarifas e itinerarios</text>
    <text x="730" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="#1B5E20">Caché en Redis</text>

    <!-- M5 Supervisión de Flota -->
    <rect x="844" y="0" width="196" height="140" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="942" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">Módulo Supervisión</text>
    <text x="942" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">[RF-05]</text>
    <text x="942" y="65" text-anchor="middle" font-size="11" fill="#333333">• Panel en tiempo real</text>
    <text x="942" y="82" text-anchor="middle" font-size="11" fill="#333333">• Control de frecuencias</text>
    <text x="942" y="99" text-anchor="middle" font-size="11" fill="#333333">• Alertas e incidentes</text>
    <text x="942" y="122" text-anchor="middle" font-size="10" font-style="italic" fill="#1B5E20">Dashboard Operador</text>
  </g>

  <!-- Capa Infraestructura y Workers -->
  <rect x="80" y="500" width="1040" height="100" rx="8" fill="#FFF9C4" stroke="#F57F17" stroke-width="2"/>
  <text x="600" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">Capa de Infraestructura: Workers Desacoplados y Persistencia por Lotes (Batch Writing)</text>
  <text x="600" y="548" text-anchor="middle" font-size="12" fill="#333333">• Worker Geoespacial Asíncrono (asyncio.to_thread / Multiprocessing para cálculo pesado fuera del Event Loop)</text>
  <text x="600" y="568" text-anchor="middle" font-size="12" fill="#333333">• Batch Telemetry Inserter (Agrupa tramas en Redis Stream y genera inserciones masivas cada 5s en PostgreSQL)</text>
  <text x="600" y="588" text-anchor="middle" font-size="12" fill="#333333">• Adaptadores de Repositorio SQLAlchemy / Asyncpg con Connection Pool limitado (evita sobrecarga de BD)</text>

  <!-- CAPA DE ALMACENAMIENTO (DATOS) -->
  <g transform="translate(180, 660)">
    <!-- Redis -->
    <rect x="0" y="0" width="380" height="130" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#BF360C">⚡ Redis en Memoria (In-Memory Data)</text>
    <text x="190" y="55" text-anchor="middle" font-size="12" fill="#333333">• <b>Redis Streams:</b> Búfer de ingesta desacoplado (XADD &lt; 1ms)</text>
    <text x="190" y="75" text-anchor="middle" font-size="12" fill="#333333">• <b>Hash Map:</b> Última ubicación conocida de los 300 buses</text>
    <text x="190" y="95" text-anchor="middle" font-size="12" fill="#333333">• <b>Pub/Sub:</b> Canal de eventos hacia Módulo WebSocket</text>
    <text x="190" y="115" text-anchor="middle" font-size="11" font-style="italic" fill="#E65100">Persistencia periódica RDB activada (evita SPOF)</text>

    <!-- PostgreSQL / PostGIS -->
    <rect x="460" y="0" width="380" height="130" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="650" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#BF360C">🐘 PostgreSQL + Extensión PostGIS</text>
    <text x="650" y="55" text-anchor="middle" font-size="12" fill="#333333">• <b>Esquema Catálogo:</b> Rutas, paraderos y geocercas espaciales</text>
    <text x="650" y="75" text-anchor="middle" font-size="12" fill="#333333">• <b>Esquema Flota:</b> Registro de 300 buses, operadores y permisos</text>
    <text x="650" y="95" text-anchor="middle" font-size="12" fill="#333333">• <b>Histórico Telemetría:</b> Particionado por día (inserción por lotes)</text>
    <text x="650" y="115" text-anchor="middle" font-size="11" font-style="italic" fill="#E65100">Índices espaciales GiST para consultas en sub-segundos</text>
  </g>

  <!-- SERVICIOS EXTERNOS -->
  <g transform="translate(50, 810)">
    <!-- OpenStreetMap -->
    <rect x="0" y="0" width="500" height="60" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="5 3" filter="url(#drop-shadow)"/>
    <text x="250" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">🗺️ OpenStreetMap / CDN Tiles (Servicio Externo Libre)</text>
    <text x="250" y="46" text-anchor="middle" font-size="11" fill="#6A1B9A">Descarga directa de teselas cartográficas por la PWA móvil del pasajero (0 costo de API)</text>

    <!-- Web Push -->
    <rect x="600" y="0" width="500" height="60" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="5 3" filter="url(#drop-shadow)"/>
    <text x="850" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">🔔 Web Push / Servicio de Alertas (Notificaciones Navegador)</text>
    <text x="850" y="46" text-anchor="middle" font-size="11" fill="#6A1B9A">Despacho de alertas de desvío de ruta, cierres viales o congestión del SIT</text>
  </g>

  <!-- FLECHAS DE CONEXIÓN -->
  <!-- Bus a API -->
  <line x1="190" y1="170" x2="250" y2="265" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="215" font-size="10" font-weight="bold" fill="#37474F">POST /telemetry</text>

  <!-- Pasajero a API (HTTP + WS) -->
  <line x1="600" y1="170" x2="600" y2="265" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="610" y="215" font-size="11" font-weight="bold" fill="#1565C0">WebSocket + HTTPS</text>

  <!-- Operador a API -->
  <line x1="1010" y1="170" x2="950" y2="265" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="985" y="215" font-size="10" font-weight="bold" fill="#37474F">HTTPS Admin</text>

  <!-- API a Módulos -->
  <line x1="250" y1="320" x2="177" y2="340" stroke="#37474F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="320" x2="519" y2="340" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="750" y1="320" x2="730" y2="340" stroke="#37474F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="320" x2="942" y2="340" stroke="#37474F" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Módulos a Infraestructura -->
  <line x1="177" y1="480" x2="177" y2="500" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="388" y1="480" x2="388" y2="500" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="519" y1="480" x2="519" y2="500" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="480" x2="730" y2="500" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="942" y1="480" x2="942" y2="500" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Infraestructura a Almacenamiento -->
  <line x1="370" y1="600" x2="370" y2="660" stroke="#E65100" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="380" y="630" font-size="10" font-weight="bold" fill="#E65100">Streams / Caché</text>

  <line x1="830" y1="600" x2="830" y2="660" stroke="#E65100" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="840" y="630" font-size="10" font-weight="bold" fill="#E65100">Batch c/5s (COPY)</text>

  <!-- Infraestructura a Externos -->
  <line x1="850" y1="790" x2="850" y2="810" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- Pasajero a OSM -->
  <path d="M 460 130 C 200 130, 200 750, 250 810" fill="none" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="160" y="780" font-size="10" fill="#6A1B9A">Tiles OSM</text>
</svg>