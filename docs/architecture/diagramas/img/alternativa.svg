<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#37474F" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C62828" />
    </marker>
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title Badge -->
  <rect x="50" y="20" width="1000" height="60" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="550" y="43" text-anchor="middle" font-size="16" font-weight="bold" fill="#B71C1C">Alternativa A (Segunda mejor en Matriz: 3.35 / 5.00) — DESCARTADA</text>
  <text x="550" y="64" text-anchor="middle" font-size="13" fill="#C62828">Monolito Tradicional en Capas (Django + PostgreSQL) • Entregable E5 (PlantUML)</text>

  <!-- ACTORES -->
  <g transform="translate(80, 105)">
    <!-- Buses GPS -->
    <rect x="0" y="0" width="260" height="75" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="130" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">🚌 300 Buses SIT (GPS)</text>
    <text x="130" y="50" text-anchor="middle" font-size="11" fill="#1565C0">Transmisión cada 10 segundos</text>
    <text x="130" y="66" text-anchor="middle" font-size="11" fill="#C62828">~30 req/s continuas</text>

    <!-- Pasajeros y Operadores -->
    <rect x="680" y="0" width="260" height="75" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="810" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">👥 Pasajeros y Operadores</text>
    <text x="810" y="50" text-anchor="middle" font-size="11" fill="#1565C0">Navegador Web / App Móvil</text>
    <text x="810" y="66" text-anchor="middle" font-size="11" fill="#546E7A">HTTP Polling continuo de paraderos</text>
  </g>

  <!-- NODO SERVIDOR VPS -->
  <rect x="80" y="215" width="620" height="550" rx="12" fill="#FAFAFA" stroke="#37474F" stroke-width="2" stroke-dasharray="6 4" filter="url(#drop-shadow)"/>
  <text x="100" y="242" font-size="15" font-weight="bold" fill="#263238">🖥️ Servidor en la Nube (VPS Único: 2-4 vCPU, 4-8 GB RAM)</text>

  <!-- Monolito en Capas Django -->
  <rect x="110" y="265" width="560" height="350" rx="10" fill="#FFFFFF" stroke="#78909C" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="130" y="292" font-size="14" font-weight="bold" fill="#37474F">📦 Monolito en Capas Tradicional (Django / WSGI)</text>

  <!-- Capa Presentación -->
  <g transform="translate(135, 315)">
    <rect x="0" y="0" width="510" height="70" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
    <text x="255" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Capa de Presentación</text>
    <text x="255" y="48" text-anchor="middle" font-size="11" fill="#546E7A">Django Views • Django REST Framework • Templates HTML</text>
    <text x="255" y="62" text-anchor="middle" font-size="10" font-style="italic" fill="#C62828">⚠️ Workers WSGI síncronos (Gunicorn sync) bloqueados bajo concurrencia</text>
  </g>

  <!-- Flecha Presentación -> Lógica -->
  <line x1="390" y1="385" x2="390" y2="415" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="403" font-size="10" fill="#37474F">Llamada síncrona en memoria</text>

  <!-- Capa Lógica -->
  <g transform="translate(135, 415)">
    <rect x="0" y="0" width="510" height="80" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
    <text x="255" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Capa de Lógica de Negocio</text>
    <text x="255" y="46" text-anchor="middle" font-size="11" fill="#546E7A">Servicios de Rutas • Algoritmo de ETA síncrono • Detección de Desvíos</text>
    <text x="255" y="62" text-anchor="middle" font-size="11" fill="#546E7A">Reglas de Tarifas y Validación de Catálogo SIT</text>
  </g>

  <!-- Flecha Lógica -> Acceso Datos -->
  <line x1="390" y1="495" x2="390" y2="525" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="513" font-size="10" fill="#37474F">Invocación de métodos ORM</text>

  <!-- Capa Acceso a Datos -->
  <g transform="translate(135, 525)">
    <rect x="0" y="0" width="510" height="70" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
    <text x="255" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#263238">Capa de Acceso a Datos</text>
    <text x="255" y="48" text-anchor="middle" font-size="11" fill="#546E7A">Django ORM • QuerySets • Modelos Relacionales</text>
    <text x="255" y="62" text-anchor="middle" font-size="10" font-style="italic" fill="#C62828">⚠️ Transacciones y conexiones síncronas bloqueantes por hilo</text>
  </g>

  <!-- Flecha Monolito -> BD -->
  <line x1="390" y1="615" x2="390" y2="645" stroke="#E65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="633" font-size="10" font-weight="bold" fill="#E65100">SQL Directo (~30 INSERT/s individuales)</text>

  <!-- Base de Datos PostgreSQL -->
  <g transform="translate(135, 645)">
    <rect x="0" y="0" width="510" height="95" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="255" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#BF360C">🐘 PostgreSQL (Base de Datos Única)</text>
    <text x="255" y="48" text-anchor="middle" font-size="11" fill="#333333">Tablas: Telemetría, Rutas, Paraderos, Usuarios, Incidentes</text>
    <text x="255" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#C62828">🚨 Cuello de botella: &gt;2,500,000 inserciones/día colapsan el I/O del disco VPS</text>
    <text x="255" y="84" text-anchor="middle" font-size="10" fill="#BF360C">Sin memoria intermedia (sin Redis) • Bloqueo de lecturas y consultas de usuarios</text>
  </g>

  <!-- OpenStreetMap Cloud -->
  <g transform="translate(740, 215)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="5 3" filter="url(#drop-shadow)"/>
    <text x="150" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">🗺️ OpenStreetMap</text>
    <text x="150" y="52" text-anchor="middle" font-size="11" fill="#6A1B9A">Servidor de Teselas Externo</text>
    <text x="150" y="68" text-anchor="middle" font-size="10" fill="#7B1FA2">Descarga directa desde clientes</text>
  </g>

  <!-- NOTE: NOTA DE DESCARTE (3 A 5 LÍNEAS EXIGIDA POR LA GUÍA) -->
  <g transform="translate(730, 340)">
    <path d="M 0 0 L 290 0 L 320 30 L 320 400 L 0 400 Z" fill="#FFFDE7" stroke="#FBC02D" stroke-width="2" filter="url(#drop-shadow)"/>
    <path d="M 290 0 L 290 30 L 320 30" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.5"/>
    <text x="20" y="35" font-size="14" font-weight="bold" fill="#F57F17">📌 NOTA DE DESCARTE</text>
    <text x="20" y="55" font-size="12" font-weight="bold" fill="#D32F2F">Puntaje en Matriz: 3.35 / 5.00</text>
    
    <text x="20" y="85" font-size="11" font-weight="bold" fill="#333333">¿Por qué se descartó la 2da mejor opción?</text>
    
    <text x="20" y="115" font-size="11" fill="#424242">1. <b>Bloqueo síncrono por WSGI:</b></text>
    <text x="20" y="132" font-size="10.5" fill="#616161">El modelo de procesos síncronos de</text>
    <text x="20" y="148" font-size="10.5" fill="#616161">Django agota los workers ante 30 req/s</text>
    <text x="20" y="164" font-size="10.5" fill="#616161">continuas de 300 buses en operación.</text>

    <text x="20" y="195" font-size="11" fill="#424242">2. <b>Saturación de I/O en la BD:</b></text>
    <text x="20" y="212" font-size="10.5" fill="#616161">La inserción directa de cada trama GPS</text>
    <text x="20" y="228" font-size="10.5" fill="#616161">vía ORM genera &gt;2.5 millones de trans-</text>
    <text x="20" y="244" font-size="10.5" fill="#616161">acciones/día en PostgreSQL, colapsando</text>
    <text x="20" y="260" font-size="10.5" fill="#616161">el disco del único VPS (R-03).</text>

    <text x="20" y="292" font-size="11" fill="#424242">3. <b>Incumplimiento de QA-01:</b></text>
    <text x="20" y="309" font-size="10.5" fill="#616161">Sin WebSockets asíncronos nativos ni</text>
    <text x="20" y="325" font-size="10.5" fill="#616161">caché Redis, la latencia de recálculo de</text>
    <text x="20" y="341" font-size="10.5" fill="#616161">ETA supera los 30 s, violando la meta</text>
    <text x="20" y="357" font-size="10.5" fill="#616161">crítica de ≤ 15 s exigida por el SIT.</text>
    <text x="20" y="385" font-size="10" font-style="italic" fill="#757575">(Ver docs/architecture/matriz-decision.md)</text>
  </g>

  <!-- Flechas Conexión Buses y Usuarios -->
  <line x1="210" y1="180" x2="210" y2="315" stroke="#C62828" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="215" y="205" font-size="10" font-weight="bold" fill="#C62828">HTTP POST Telemetría</text>

  <line x1="780" y1="180" x2="600" y2="315" stroke="#1565C0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="725" y="255" font-size="10" fill="#1565C0">HTTP GET Polling</text>

  <line x1="840" y1="180" x2="840" y2="215" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
</svg>